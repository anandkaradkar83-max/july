name: Artifacts upload pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create application file
        run: echo "This is the testing code" > app.js

      # Step 1: Upload the file as an artifact
      - name: Upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: application-artifact
          path: app.js

  deploy:
    runs-on: ubuntu-latest
    needs: build # This ensures deployment waits for the build job to finish
    steps:
      # Step 2: Download the artifact uploaded in the build job
      - name: Download the artifact
        uses: actions/download-artifact@v4
        with:
          name: application-artifact

      # Step 3: Test and verify the downloaded artifact
      - name: Test and verify artifact
        run: |
          echo "Checking if app.js exists..."
          cat app.js
